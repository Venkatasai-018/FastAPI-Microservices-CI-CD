name: FastAPI Microservices CI/CD Pipeline

on:
  workflow_dispatch:

  
jobs:
  build:
    runs-on: self-hosted
    


    steps:
    - name: Check out code
      uses: actions/checkout@v6
      with:
        ref: feat/1

    - name: Stop and remove existing containers & images
      run: |
        docker stop $(docker ps -aq) 
        docker rm $(docker ps -aq)
        docker rmi $(docker images -q)
    
    - name: docker build for v1
      run: |
        docker build -t fastapi-app-v1 -f app-v1/Dockerfile .
    
    - name: docker build for v2
      run: |
        docker build -t fastapi-app-v2 -f app-v2/Dockerfile .

    - name: Tagging docker images
      run: |
        docker tag fastapi-app-v1:latest ${{ secrets.DOCKER_USERNAME }}/fastapi-app-v1:latest
        docker tag fastapi-app-v2:latest ${{ secrets.DOCKER_USERNAME }}/fastapi-app-v2:latest
    - name: push docker images to Docker Hub
      run: |
        echo ${{ secrets.DOCKER_PAT }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
        docker push ${{ secrets.DOCKER_USERNAME }}/fastapi-app-v1:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/fastapi-app-v2:latest

